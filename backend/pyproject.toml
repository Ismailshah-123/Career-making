[project]
name = "careergpt-backend"
version = "1.0.0"
description = "CareerGPT — AI-powered job application automation platform (backend)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "pydantic==2.9.2",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",

    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",

    "groq==0.12.0",
    "anthropic==0.39.0",
    "openai==1.54.0",

    "langgraph==0.2.53",
    "langchain-core==0.3.15",

    "sentence-transformers==3.3.1",
    "torch==2.5.1",
    "qdrant-client==1.12.0",

    "redis==5.2.0",
    "celery==5.4.0",

    "playwright==1.48.0",
    "curl_cffi==0.7.4",

    "reportlab==4.2.5",
    "weasyprint==63.1",
    "pdfplumber==0.11.4",
    "pymupdf==1.24.14",
    "python-docx==1.1.2",
    "odfpy==1.4.1",
    "python-magic==0.4.27",
    "pytesseract==0.3.13",
    "chardet==5.2.0",

    "httpx==0.27.2",

    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.0",
    "passlib==1.7.4",

    "jinja2==3.1.4",
    "aiosmtplib==3.0.2",
    "aiobotocore==2.15.2",

    "tenacity==9.0.0",
    "nest-asyncio==1.6.0",

    "loguru==0.7.2",
    "sentry-sdk[fastapi]==2.18.0",

    "python-dotenv==1.0.1",
    "pillow==11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
